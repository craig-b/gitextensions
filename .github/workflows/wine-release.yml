# Builds the Wine distribution of Git Extensions entirely on Linux: the portable app archive (own
# executables, plugins, translations, ConEmu) and the Linux-side pieces (the native git bridge daemon,
# the terminal relay, the launcher and helper scripts). A push to wine-support builds and keeps the
# archives as workflow artifacts; a wine-v<version> tag publishes them as a GitHub release, where
# <version> is <upstream version base>.<build number> and the base must match the one this branch is
# built on or the job fails. The informational version and the archive names carry -dev while that
# base is an upstream master upstream has not released, plus -wine always, because the build is never
# plain upstream.
# See docs/running-under-wine.md.
name: Wine release

on:
  push:
    branches: [wine-support]
    tags: ['wine-v*']
  pull_request:
    branches: [wine-support]

permissions:
  contents: write

concurrency:
  group: wine-release-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NuGetAudit: false
  # Upstream's own single source of truth for the version base; the build number beside it is ours.
  # Hard-coding the base here would go stale silently every time the branch is rebased onto upstream.
  GE_VERSION_BASE_FILE: .github/workflows/_app-build-core.yml

jobs:
  build:
    # 22.04's glibc 2.35 is the daemon's baseline; the daemon is a native binary
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # This branch is a patch series rebased onto upstream, so its base is what the build is made of:
      # it says whether the version being stamped is a released one, and it bounds the release notes.
      - name: Locate the upstream base
        id: upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/gitextensions/gitextensions.git
          git fetch --quiet --tags upstream master
          base=$(git merge-base HEAD upstream/master)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # Upstream tags releases on release/* branches, never on master, so a master commit counts as
          # released once some v* tag contains it. Until then the version base is one upstream has not
          # shipped, and the build must not present itself as that release.
          if [ -n "$(git tag --list 'v*' --contains "$base")" ]; then
            state=""
          else
            state="-dev"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Based on upstream $(git rev-parse --short "$base")${state:+ (unreleased)}"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MinGW and clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 clang zlib1g-dev

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-wine-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-wine-

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          # The first three components come from upstream and move with it, so a rebase carries them
          # forward on its own.
          vbase=$(grep -oP 'BUILD_VERSION_BASE:\s*\K[0-9.]+' "$GE_VERSION_BASE_FILE")
          [ -n "$vbase" ] || { echo "::error::no BUILD_VERSION_BASE in $GE_VERSION_BASE_FILE"; exit 1; }
          # A tag states the whole version, and is checked against the base rather than trusted. That
          # is what keeps it from drifting: the version a release claims cannot quietly stop matching
          # the upstream it was built on, because the mismatch fails the job.
          if [[ "$GITHUB_REF" == refs/tags/wine-v* ]]; then
            version="${GITHUB_REF#refs/tags/wine-v}"
            [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]+)$ ]] \
              || { echo "::error::tag must be wine-v<major>.<minor>.<patch>.<build>, got '$version'"; exit 1; }
            if [ "${BASH_REMATCH[1]}" != "$vbase" ]; then
              echo "::error::tag says ${BASH_REMATCH[1]} but this branch is built on $vbase; retag as wine-v$vbase.${BASH_REMATCH[2]}"
              exit 1
            fi
          else
            version="$vbase.0"
          fi
          # Only the assembly version has to be four bare numbers. The informational version says what
          # the build really is: an upstream base this fork has not seen released, plus the Wine patches.
          suffix="${{ steps.upstream.outputs.state }}-wine"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version-text=$version$suffix" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Read by Project.Publish.targets so the packaged file names match the informational version.
          echo "ARTIFACT_BUILD_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "Building $version$suffix at $(git rev-parse --short HEAD)"

      # Stamping rewrites tracked files, and GitInfo would then mark the build "(Dirty)" — which is a
      # lie about a release built from a clean tag. Upstream solves this with eng/Mark-RepoClean.ps1
      # before its release builds; that script is PowerShell and joins paths with backslashes, so do
      # the same thing directly rather than carry a patch to a file upstream also edits.
      - name: Mark the stamped files as clean
        run: |
          set -euo pipefail
          git update-index --skip-worktree \
            CommonAssemblyInfo.cs \
            CommonAssemblyInfoExternals.cs \
            externals/NetSpell.SpellChecker/Properties/AssemblyInfo.cs \
            src/native/GitExtSshAskPass/SshAskPass.rc2 \
            src/native/GitExtensionsShellEx/GitExtensionsShellEx.rc
          git submodule --quiet foreach --recursive \
            'git ls-files "*AssemblyInfo.cs" | while IFS= read -r f; do git update-index --skip-worktree "$f"; done'

      - name: Stamp version
        working-directory: eng
        run: dotnet run set_version_to.cs -- -v "${{ steps.version.outputs.version }}" -t "${{ steps.version.outputs.version-text }}"

      - name: Build
        run: dotnet build GitExtensions.slnx -c Release -p:EnableWindowsTargeting=true -p:ContinuousIntegrationBuild=true --nologo -v q

      - name: Publish portable app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet publish GitExtensions.slnx -c Release --no-build -p:EnableWindowsTargeting=true -p:ContinuousIntegrationBuild=true --nologo -v q

      - name: Build the Linux-side pieces
        run: |
          set -e
          out=artifacts/wine/gitext-wine
          mkdir -p "$out"
          dotnet publish eng/wine/git-bridge.cs -o "$out/git-bridge" --nologo -v q
          rm -f "$out/git-bridge/"*.dbg
          x86_64-w64-mingw32-gcc -O2 -municode -o "$out/bridge-tty.exe" eng/wine/bridge-tty.c -lws2_32
          install -m755 eng/wine/gitext-wine eng/wine/git-bridge-editor eng/wine/open-terminal eng/wine/install.sh eng/wine/update "$out/"
          install -m644 eng/wine/gitext-wine.desktop docs/running-under-wine.md "$out/"
          mkdir -p "$out/icons"
          for size in 16 24 32 48 64 128 256 512; do
            install -m644 "setup/assets/Logo/git-extensions-logo-${size}px.png" "$out/icons/gitext-wine-${size}.png"
          done

      - name: Name the archives
        id: names
        run: |
          v="${{ steps.version.outputs.version-text }}-${{ steps.version.outputs.sha }}"
          zip=$(ls artifacts/Release/publish/GitExtensions-Portable-x64-*.zip)
          echo "app=$zip" >> "$GITHUB_OUTPUT"
          echo "linux=artifacts/wine/gitext-wine-linux-x64-$v.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Pack the Linux tarball and checksums
        run: |
          set -e
          tar -C artifacts/wine -czf "${{ steps.names.outputs.linux }}" gitext-wine
          (cd "$(dirname "${{ steps.names.outputs.app }}")" && sha256sum "$(basename "${{ steps.names.outputs.app }}")") > artifacts/wine/SHA256SUMS
          (cd artifacts/wine && sha256sum "$(basename "${{ steps.names.outputs.linux }}")") >> artifacts/wine/SHA256SUMS
          cat artifacts/wine/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitext-wine-${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha }}
          path: |
            ${{ steps.names.outputs.app }}
            ${{ steps.names.outputs.linux }}
            artifacts/wine/SHA256SUMS
          retention-days: 14

      # A release is upstream at some commit plus this branch's Wine patches, so the notes are that
      # patch series. GitHub's generated notes infer a range from the previous tag, which stops
      # meaning anything once the branch has been rebased and the previous tag is no longer an
      # ancestor; deriving the range from the upstream base survives every rewrite.
      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/wine-v')
        run: |
          set -euo pipefail
          base="${{ steps.upstream.outputs.base }}"
          tag="${GITHUB_REF#refs/tags/}"
          {
            echo "Built on Linux for running under Wine."
            echo
            echo "### Install"
            echo
            # Single quotes: the fence is backticks, which the shell would otherwise run.
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/wine-support/eng/wine/install.sh | sh"
            echo '```'
            echo
            echo "Installs or updates everything: the app, a Wine prefix with the .NET desktop runtime, a launcher on PATH, a menu entry and icons. Needs wine 10 or later, nothing needs root, and re-running updates in place, keeping your settings."
            echo
            echo "Append \`-s -- --tag $tag\` to install this release rather than the latest, \`-s -- --help\` for the other options, and \`-s -- uninstall\` to remove it again. Setup and background: docs/running-under-wine.md, also in the Linux tarball."
            echo
            echo "Based on upstream [\`$(git rev-parse --short "$base")\`](https://github.com/gitextensions/gitextensions/commit/$base) ($(git log -1 --format=%cs "$base"))."
            echo
            echo "### Wine patches in this build"
            echo
            git log --reverse --format='- %s' "$base..HEAD"
          } > artifacts/wine/notes.md
          cat artifacts/wine/notes.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/wine-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --repo is not optional here: locating the upstream base adds an "upstream" remote to the
          # checkout, and without being told otherwise gh resolves the repository from the remotes and
          # tries to publish the release to upstream, where the tag does not exist.
          gh release create "${GITHUB_REF#refs/tags/}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Git Extensions for Wine ${{ steps.version.outputs.version-text }}" \
            --notes-file artifacts/wine/notes.md \
            "${{ steps.names.outputs.app }}" \
            "${{ steps.names.outputs.linux }}" \
            artifacts/wine/SHA256SUMS
